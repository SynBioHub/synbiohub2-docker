services:
    virtuoso:
        build:
            context: .
            dockerfile: Dockerfile.virtuoso
        environment:
            - VIRT_SPARQL_MaxQueryCostEstimationTime=default
            - VIRT_SPARQL_MaxQueryExecutionTime=300
            - VIRT_Parameters_ServerThreads=30
            - VIRT_HTTPServer_ServerThreads=300
        # ports:
        #     - "8890:8890"
        volumes: 
            - type: volume
              source: virtuoso-db1
              target: /data
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8890/sparql"]
            interval: 15s
            timeout: 10s
            retries: 4
    synbiohub:
        image: synbiohub/synbiohub:1.6.1-standalone
        depends_on:
            virtuoso:
                condition: service_healthy
        ports:
            - "7777:7777"
        volumes:
            - type: volume
              source: sbh1
              target: /mnt
            - type: volume
              source: virtuoso-db1
              target: /virtuoso
        restart: always

    synbiohubFrontend:
        image: synbiohub/sbh3frontend:snapshot
        ports:
            - "3333:3333"
        labels:
            - "com.docker.desktop.open.url=http://localhost:3333"
        restart: always
volumes:
    virtuoso-db1:
    sbh1:

